<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Spotify</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .card {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            margin: 0 0 12px;
        }
        p {
            color: #a7a7a7;
            line-height: 1.6;
            margin: 0 0 28px;
        }
        .button {
            background-color: #1db954;
            border-radius: 500px;
            color: #121212;
            display: inline-block;
            font-weight: 700;
            padding: 14px 32px;
            text-decoration: none;
        }
        .button:hover {
            background-color: #1ed760;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Connect your Spotify</h1>
        <p>Log in with Spotify so your current track plays on the LED matrix.</p>
        <a class="button" href="/spotify/login">Connect my Spotify</a>
        <p id="status"></p>
    </main>
    <script>
        const status = document.getElementById("status");

        async function refresh() {
            try {
                const res = await fetch("/spotify/status", { cache: "no-store" });
                if (!res.ok) throw new Error(String(res.status));
                const s = await res.json();
                const user = s.activeUser ? "Connected as " + s.activeUser : "Not connected";
                const track = s.track
                    ? "Now playing: " + s.track.title + (s.track.artist ? " by " + s.track.artist : "")
                    : "Nothing playing";
                status.textContent = user + " · " + track;
            } catch {
                status.textContent = "Cannot reach the server";
            }
        }

        refresh();
        setInterval(refresh, 5000);
    </script>
</body>
</html>
