[package]
name = "librespot-jni"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cargo prefixes the `lib`, so this crate produces librespot_jni.so.
name = "respot_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# Pinned: the Connect session and the sink are built on these versions.
librespot-core = { version = "=0.8.0", default-features = false, features = [
  "rustls-tls-webpki-roots",
] }
librespot-connect = { version = "=0.8.0", default-features = false }
librespot-playback = { version = "=0.8.0", default-features = false }
# librespot 0.8.0's build script breaks when a fresh resolution picks a newer vergen-lib
# patch; these pins match the versions in its own Cargo.lock.
vergen = { version = "=9.0.6", default-features = false }
vergen-gitcl = { version = "=1.0.8", default-features = false, features = [
  "build",
] }
vergen-lib = { version = "=0.1.6" }
