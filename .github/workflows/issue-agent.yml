name: issue agent

on:
  issues:
    types: [opened]

jobs:
  implement:
    # Only on creation: labels set at creation mean "the agent may take this one unattended".
    # Labeling an existing issue does not start a run; use the `implement` comment instead.
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'ai-ready') &&
      contains(github.event.issue.labels.*.name, 'auto')
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
      actions: write
      # GITHUB_TOKEN has no workflows permission; `workflows: write` would invalidate this file.
    # Same group as issue-implement-comment.yml so the two paths never run one issue at once.
    concurrency:
      group: issue-agent-${{ github.event.issue.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/issue-implement.yml
    with:
      issue: ${{ github.event.issue.number }}
      automerge: true
    secrets: inherit
