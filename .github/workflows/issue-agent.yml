name: issue agent

on:
  issues:
    types: [labeled]

jobs:
  implement:
    # Both labels, in any order, mean "the agent may take this one unattended".
    # Only the last-added one triggers, so later label edits do not rerun it.
    if: >-
      github.event.issue.state == 'open' &&
      (github.event.label.name == 'ai-ready' || github.event.label.name == 'auto') &&
      contains(github.event.issue.labels.*.name, 'ai-ready') &&
      contains(github.event.issue.labels.*.name, 'auto')
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
      actions: write
      # GITHUB_TOKEN has no workflows permission; `workflows: write` would invalidate this file.
    # Same group as issue-implement-comment.yml so the two paths never run one issue at once.
    concurrency:
      group: issue-agent-${{ github.event.issue.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/issue-implement.yml
    with:
      issue: ${{ github.event.issue.number }}
      automerge: true
    secrets: inherit
