name: firetv debug

# Manual only. Builds a debug APK and uploads it as an artifact.
#
# Deliberately separate from the release workflow: a debug build needs no keystore and no signing
# secrets, so it still works before the release keystore exists. Android signs debug builds with a
# generated key, which means a new build cannot be installed over an older one (uninstall first);
# the app holds no local state, so nothing is lost.
#
# Needs LED_SERVER_URL and TV_TOKEN, the same secrets the other deploy workflows use.
#
# The ubuntu runner image already has the Android SDK (ANDROID_HOME) with platform 34, so no setup
# action or sdkmanager call is needed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firetv-debug
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the secrets
        env:
          LED_SERVER_URL: ${{ secrets.LED_SERVER_URL }}
          TV_TOKEN: ${{ secrets.TV_TOKEN }}
        run: |
          for name in LED_SERVER_URL TV_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "missing $name secret"
              exit 1
            fi
          done

      - name: Write tv-app/config.js
        env:
          LED_SERVER_URL: ${{ secrets.LED_SERVER_URL }}
          TV_TOKEN: ${{ secrets.TV_TOKEN }}
        run: |
          {
            echo "var LED_SERVER_URL = \"$LED_SERVER_URL\";"
            echo "var TV_TOKEN = \"$TV_TOKEN\";"
          } > tv-app/config.js

      - name: Build the native library
        run: bash android-app/build-native.sh

      - run: pnpm android:build

      - name: Check the native library is packaged
        run: unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep librespot_jni

      - uses: actions/upload-artifact@v4
        with:
          name: firetv-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
