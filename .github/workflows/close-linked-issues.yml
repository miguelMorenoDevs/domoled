name: close linked issues

on:
  pull_request:
    types: [closed]

# GitHub closes issues natively only when the closing keyword is in the PR title
# or body. This workflow is the safety net for merged PRs where it did not run.
permissions:
  contents: read
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The event's merge ref may be gone after the merge; the script lives on main.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Close linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Pass untrusted text through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/close-linked-issues.sh
