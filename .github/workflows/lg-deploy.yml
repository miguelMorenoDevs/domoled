name: lg deploy

on:
  push:
    branches: [main]
    paths:
      - "lg-app/**"
      - "src/animator/**"
      - "src/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/lg-deploy.yml"
  workflow_dispatch:

concurrency:
  group: lg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The TV only accepts installs from its own network, so this runs on a runner there, not on GitHub-hosted.
    runs-on: [self-hosted, lg-tv]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # Native modules are not built in CI; the LG build does not need them.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Write lg-app/config.js
        env:
          LED_SERVER_URL: ${{ secrets.LED_SERVER_URL }}
        run: node lg-app/deploy.mjs config

      - run: pnpm lg:package

      - name: Pair the TV, install and launch
        env:
          TV_HOST: ${{ secrets.TV_HOST }}
          TV_KEY: ${{ secrets.TV_KEY }}
        run: node lg-app/deploy.mjs deploy
