name: issue implement

# Reusable: callers pass the issue number and whether the PR is auto-merged.
on:
  workflow_call:
    inputs:
      issue:
        description: Issue number to implement
        required: true
        type: number
      automerge:
        description: Enable auto-merge on the PR the agent opens
        required: true
        type: boolean

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
      actions: write
      # GITHUB_TOKEN has no workflows permission; `workflows: write` would invalidate this file.
    steps:
      - name: Create implement app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          # The numeric App ID (digits only), not the Client ID.
          client-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          # No permission-* inputs: the token gets every permission the App is installed with, as in pr-review.yml.

      - uses: actions/checkout@v6
        with:
          # Checkout persists this token, so the agent's git push uses it.
          token: ${{ steps.app.outputs.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # tsc only needs the types; native modules are not built in CI.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install OpenCode
        run: npm install -g @opencode/cli

      - name: Sign in to OpenCode
        env:
          OPENCODE_CLIENT_ID: ${{ secrets.OPENCODE_CLIENT_ID }}
        run: bash .github/scripts/opencode-login.sh

      - name: Implement issue
        run: bash .github/scripts/opencode-run.sh --model opencode-go/deepseek-v4.1-flash "$PROMPT"
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: |
            Implement GitHub issue #${{ inputs.issue }} end to end and open a PR that closes it.
            Read the issue with `gh issue view ${{ inputs.issue }}`.
            Follow `.opencode/skills/issue/SKILL.md`, `.opencode/skills/pr/SKILL.md` and `.opencode/skills/ponytail/SKILL.md`.
            Work non-interactively: never ask questions; make a reasonable call and note assumptions in the PR.
            Do not use web search or fetch URLs; local files and `gh` are enough.
            Run `pnpm build` before committing. Skip live Spotify and simulator checks that need `.env` or hardware,
            and state what you did not verify under `## Verification`.
            ${{ inputs.automerge && 'Enable auto-merge on the PR as the pr skill describes.' || 'Do not enable auto-merge: a human merges this PR.' }}
            After opening the PR, request the review yourself with `gh workflow run pr-review.yml -f pr=<n>`.
