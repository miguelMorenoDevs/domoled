name: ci

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # Native modules are not built in CI; tsc, eslint, prettier and tests do not need them.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test
